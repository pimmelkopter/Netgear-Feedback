<!-- web/templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch VLAN Management</title>
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <style>
        .selected {
            border: 2px solid #EF4444 !important;
            transform: scale(1.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .pending-change {
            border: 2px solid #EF4444 !important;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .port-button, .vlan-button {
            min-height: 5rem;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
  {% if show_login %}
    <!-- Login Form -->
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-lg">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Switch Management Login</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Please sign in to continue</p>
        </div>
        <form class="mt-8 space-y-6" action="/login" method="POST">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">Username</label>
                    <input id="username" 
                           name="username" 
                           type="text" 
                           required 
                           minlength="3"
                           pattern="[a-zA-Z0-9_-]+"
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" 
                           placeholder="Username">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" 
                           name="password" 
                           type="password" 
                           required
                           minlength="4"
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" 
                           placeholder="Password">
                </div>
            </div>

            {% if error %}
                <div class="rounded-md bg-red-50 p-4 mt-4" role="alert">
                <p class="text-sm font-medium text-red-800">{{ error }}</p>
            </div>
            {% endif %}

            <button type="submit" 
                    class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Sign in
            </button>
        </form>
    </div>
</div>
  {% else %}
    <!-- Main Interface -->
  <div class="container mx-auto px-4 py-8">
       <!-- Header-Komponente -->
       <switch-header></switch-header>
            
       <!-- Hauptinhalt -->
       <main class="space-y-6">
           <port-grid></port-grid>
           <vlan-selector></vlan-selector>
           <action-bar></action-bar>
       </main>
   </div>
{% endif %}

<script type="module">
   // Web Components Definition
   class SwitchHeader extends HTMLElement {
       connectedCallback() {
           this.innerHTML = `
               <div class="mb-8 flex justify-between items-center bg-white rounded-lg shadow p-4">
                   <h1 class="text-2xl font-bold text-gray-900">VLAN Configuration</h1>
                   <div class="flex space-x-4 items-center">
                       <span id="connection-status" class="status-badge"></span>
                   </div>
               </div>
           `;
       }
   }

   class PortGrid extends HTMLElement {
       constructor() {
           super();
           this.state = {
               ports: [],
               selectedPort: null,
               pendingChanges: new Map()
           };
       }

       connectedCallback() {
        store.subscribe(state => {
            this.state.selectedVlan = state.selectedVlan;
            this.state.pendingChanges = state.pendingChanges;
            this.render();
        });
        this.loadData();
        setInterval(() => this.loadData(), 5000);
    }

    handlePortClick(portId) {
        if (!this.state.selectedVlan) return;
        
        const newChanges = new Map(this.state.pendingChanges);
        if (newChanges.get(portId) === this.state.selectedVlan) {
            newChanges.delete(portId);
        } else {
            newChanges.set(portId, this.state.selectedVlan);
        }
        
        store.setState({ pendingChanges: newChanges });
    }
    
    async loadData() {
           try {
               const response = await fetch('/api/refresh', {method: 'POST'});
               const data = await response.json();
               this.state.ports = Object.entries(data.port_vlans).map(([port, vlan]) => ({
                   id: parseInt(port),
                   vlan,
                   name: data.vlan_names[vlan],
                   color: data.vlan_colors[vlan]
               }));
               this.render();
           } catch (error) {
               console.error('Error loading port data:', error);
           }
       }

       render() {
           this.innerHTML = `
               <div class="bg-white rounded-lg shadow p-6 mb-6">
                   <h2 class="text-xl font-semibold mb-4">Ports</h2>
                   <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-12 gap-2">
                       ${this.state.ports.map(port => `
                           <button class="port-button ${port.id === this.state.selectedPort ? 'selected' : ''}"
                                   style="background-color: ${port.color}"
                                   data-port="${port.id}">
                               <div class="font-bold">Port ${port.id}</div>
                               <div class="text-sm">${port.name}</div>
                           </button>
                       `).join('')}
                   </div>
               </div>
           `;
       }

       addEventListeners() {
           this.addEventListener('click', e => {
               const portButton = e.target.closest('.port-button');
               if (portButton) {
                   this.state.selectedPort = parseInt(portButton.dataset.port);
                   this.dispatchEvent(new CustomEvent('port-selected', {
                       detail: this.state.selectedPort
                   }));
                   this.render();
               }
           });
       }
   }
   class VlanSelector extends HTMLElement {
        constructor() {
            super();
            this.state = {
                vlans: {},
                selectedVlan: null
            };
        }

        async connectedCallback() {
            await this.loadData();
            this.render();
            this.addEventListeners();
        }

        async loadData() {
            try {
                const response = await fetch('/api/refresh', {method: 'POST'});
                const data = await response.json();
                this.state.vlans = Object.entries(data.vlan_colors).map(([id, color]) => ({
                    id: parseInt(id),
                    color,
                    name: data.vlan_names[id]
                }));
                this.render();
            } catch (error) {
                console.error('Error loading VLAN data:', error);
            }
        }

        render() {
            this.innerHTML = `
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <h2 class="text-xl font-semibold mb-4">VLANs</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        ${this.state.vlans.map(vlan => `
                            <button class="vlan-button ${vlan.id === this.state.selectedVlan ? 'selected' : ''}"
                                    style="background-color: ${vlan.color}"
                                    data-vlan="${vlan.id}">
                                <div class="font-bold">${vlan.name || `VLAN ${vlan.id}`}</div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        addEventListeners() {
            this.addEventListener('click', e => {
                const vlanButton = e.target.closest('.vlan-button');
                if (vlanButton) {
                    const vlanId = parseInt(vlanButton.dataset.vlan);
                    this.state.selectedVlan = this.state.selectedVlan === vlanId ? null : vlanId;
                    store.setState({ selectedVlan: this.state.selectedVlan });
                    this.render();
                }
            });
        }
    }

    class ActionBar extends HTMLElement {
        constructor() {
            super();
            this.state = {
                pendingChanges: new Map()
            };
        }

        connectedCallback() {
            store.subscribe(state => {
                this.state.pendingChanges = state.pendingChanges;
                this.render();
            });
            this.render();
            this.addEventListeners();
        }

        render() {
            const hasPending = this.state.pendingChanges.size > 0;
            this.innerHTML = `
                <div class="bg-white rounded-lg shadow p-4 flex justify-between items-center sticky bottom-4">
                    <div class="text-sm text-gray-600" id="status-message">
                        ${hasPending ? `${this.state.pendingChanges.size} changes pending` : 'Select a VLAN to begin'}
                    </div>
                    <div class="space-x-4">
                        <button id="cancel-button"
                                class="px-4 py-2 rounded-lg ${hasPending ? 'bg-gray-500 hover:bg-gray-600 text-white' : 'bg-gray-300 cursor-not-allowed'}"
                                ${!hasPending ? 'disabled' : ''}>
                            Cancel Changes
                        </button>
                        <button id="apply-button"
                                class="px-4 py-2 rounded-lg ${hasPending ? 'bg-green-500 hover:bg-green-600 text-white' : 'bg-gray-300 cursor-not-allowed'}"
                                ${!hasPending ? 'disabled' : ''}>
                            Apply Changes
                        </button>
                    </div>
                </div>
            `;
        }

        addEventListeners() {
            this.addEventListener('click', e => {
                if (e.target.id === 'apply-button' && this.state.pendingChanges.size > 0) {
                    this.applyChanges();
                } else if (e.target.id === 'cancel-button' && this.state.pendingChanges.size > 0) {
                    store.setState({ pendingChanges: new Map() });
                }
            });
        }

        async applyChanges() {
            const api = new SwitchAPI();
            for (const [portId, vlanId] of this.state.pendingChanges) {
                try {
                    await api.updatePort(portId, vlanId);
                } catch (error) {
                    console.error(`Failed to update port ${portId}:`, error);
                }
            }
            store.setState({ pendingChanges: new Map() });
        }
    }

   // Registrierung der Web Components
    customElements.define('switch-header', SwitchHeader);
    customElements.define('port-grid', PortGrid);
    customElements.define('vlan-selector', VlanSelector);
    customElements.define('action-bar', ActionBar);
   // Weitere Komponenten hier definieren...
</script>
</body>
</html>
