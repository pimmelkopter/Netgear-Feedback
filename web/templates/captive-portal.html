<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <meta http-equiv="refresh" content="0; url=http://captive.apple.com/hotspot-detect.html">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold">Switch Management Portal</h1>
                <p class="text-gray-600 mt-2">Please login to access the network</p>
            </div>
            
            <form method="POST" action="/login" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" name="username" required
                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 
                                  focus:ring-indigo-500 focus:border-indigo-500"
                           autocomplete="username">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required
                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 
                                  focus:ring-indigo-500 focus:border-indigo-500"
                           autocomplete="current-password">
                </div>

                {% if error %}
                <div class="p-3 bg-red-100 text-red-700 rounded" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md 
                               shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 
                               focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Login
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitButton = form.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                
                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content
                        },
                        body: JSON.stringify({
                            username: document.getElementById('username').value,
                            password: document.getElementById('password').value
                        })
                    });

                    if (response.ok) {
                        window.location.href = '/';
                    } else {
                        const error = await response.text();
                        throw new Error(error);
                    }
                } catch (error) {
                    console.error('Login failed:', error);
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'p-3 bg-red-100 text-red-700 rounded mt-4';
                    errorDiv.textContent = error.message || 'Login failed';
                    form.appendChild(errorDiv);
                } finally {
                    submitButton.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
